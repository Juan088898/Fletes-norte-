<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Camionero · modo principal de Fletes del Norte (logo original, pareja del de YiYi) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffae3d"/>
      <stop offset="1" stop-color="#f07f12"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
  <!-- círculo crema, como el pin de YiYi -->
  <circle cx="256" cy="232" r="150" fill="#fff4d6"/>
  <!-- tráiler de lado: caja + cabina -->
  <g fill="#26324d">
    <rect x="128" y="168" width="168" height="96" rx="14"/>
    <path d="M306 196h52c10 0 18 5 23 13l22 34c3 5 5 11 5 17v14c0 8-6 14-14 14H306z"/>
    <rect x="128" y="270" width="270" height="16" rx="8"/>
  </g>
  <path d="M322 208h34l18 30h-52z" fill="#9fd3ff"/>
  <!-- franja naranja en la caja -->
  <rect x="146" y="206" width="132" height="18" rx="9" fill="#ffae3d"/>
  <!-- llantas -->
  <g fill="#26324d" stroke="#fff4d6" stroke-width="8">
    <circle cx="170" cy="292" r="24"/><circle cx="222" cy="292" r="24"/><circle cx="360" cy="292" r="24"/>
  </g>
  <g fill="#ffae3d"><circle cx="170" cy="292" r="7"/><circle cx="222" cy="292" r="7"/><circle cx="360" cy="292" r="7"/></g>
  <text x="256" y="472" text-anchor="middle" font-family="Fredoka, Arial Rounded MT Bold, sans-serif" font-weight="700" font-size="56" fill="#fff4d6" letter-spacing="3">CAMIONERO</text>
</svg>
