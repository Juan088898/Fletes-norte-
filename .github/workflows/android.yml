name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, package.json, capacitor.config.json, .github/workflows/android.yml]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Instalar Capacitor
        run: npm install
      - name: Copiar el juego a www
        run: mkdir -p www && cp index.html www/index.html
      - name: Crear proyecto Android
        run: npx cap add android && npx cap sync android
      - name: Forzar horizontal
        run: sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fletes-del-norte-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
